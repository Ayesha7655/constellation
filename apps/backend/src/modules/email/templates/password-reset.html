<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reset your Constellation password</title>
  </head>
  <body style="font-family: system-ui, sans-serif; line-height: 1.5; color: #18181b;">
    <p>We received a request to reset your Constellation password.</p>
    <p>
      <a href="{{actionLink}}" style="display: inline-block; padding: 10px 16px; background: #18181b; color: #fafafa; text-decoration: none; border-radius: 6px;">
        Reset password
      </a>
    </p>
    <p>Or open this link in your browser:</p>
    <p><a href="{{actionLink}}">{{actionLink}}</a></p>
    <p style="font-size: 14px; color: #71717a;">
      Constellation runs at <a href="{{webUrl}}">{{webUrl}}</a>. Use the link above on that site.
    </p>
    <p style="font-size: 14px; color: #71717a;">
      If you did not request this, you can ignore this email. The link expires after a short time.
    </p>
  </body>
</html>
